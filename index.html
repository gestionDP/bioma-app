<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070C0E">
<title>Bioma · Sistema operativo de ecosistemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#070C0E; --deep:#0B1214; --card:#111B1D; --card2:#162426; --line:#1E2E30;
  --txt:#E7F0EC; --dim:#8FA69D; --faint:#5E736C;
  --moss:#7FD1A6; --wood:#D08A57; --led:#A98BF5; --alert:#F07461; --warn:#E8B14C;
  --r:14px; --r-sm:10px;
  --ff-d:'Space Grotesk',system-ui,sans-serif;
  --ff-b:'Inter',system-ui,-apple-system,sans-serif;
  --ff-m:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 70% at 50% -10%, #10201F 0%, transparent 60%),
    var(--abyss);
  color:var(--txt); font-family:var(--ff-b); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1D2C2E;border-radius:4px}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;border-right:1px solid var(--line);
  padding:22px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:4px;background:rgba(7,12,14,.6);backdrop-filter:blur(12px);z-index:20
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.brand b{font-family:var(--ff-d);font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--ff-m);font-size:9.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(155deg,var(--moss),#2C6B57 60%,var(--led));flex:0 0 auto}
.navlink{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);
  color:var(--dim);font-size:14.5px;transition:.15s
}
.navlink:hover{background:var(--card);color:var(--txt)}
.navlink.on{background:var(--card2);color:var(--txt)}
.navlink .ic{width:18px;text-align:center;opacity:.9}
.navsec{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:18px 10px 7px}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
main{flex:1;min-width:0;padding:26px 30px 120px;max-width:1180px}

/* ---------- typography ---------- */
h1{font-family:var(--ff-d);font-size:26px;font-weight:600;letter-spacing:-.025em}
h2{font-family:var(--ff-d);font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:2px}
h3{font-family:var(--ff-d);font-size:14.5px;font-weight:600}
.eyebrow{font-family:var(--ff-m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.num{font-family:var(--ff-m);font-variant-numeric:tabular-nums}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,var(--card) 0%,#0F1819 100%);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.sep{height:1px;background:var(--line);margin:12px 0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);
  background:var(--card2);border:1px solid var(--line);font-size:13.5px;transition:.15s;white-space:nowrap
}
.btn:hover{border-color:#2E4443;background:#1B2B2D}
.btn.primary{background:var(--moss);color:#06231A;border-color:transparent;font-weight:600}
.btn.primary:hover{background:#96DDB7}
.btn.ghost{background:none}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:focus-visible,.navlink:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:2px solid var(--moss);outline-offset:2px}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-family:var(--ff-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--moss);border-color:#22503E;background:#0E211A}
.pill.warn{color:var(--warn);border-color:#4A3B18;background:#211A0B}
.pill.bad{color:var(--alert);border-color:#4E2620;background:#22110E}
.pill.led{color:var(--led);border-color:#3A2F60;background:#150F26}
.pill.wood{color:var(--wood);border-color:#4A3122;background:#20140D}
.tag{font-family:var(--ff-m);font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

/* ---------- ecosystem card ---------- */
.eco{display:flex;gap:0;overflow:hidden;cursor:pointer;transition:.18s;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.eco:hover{border-color:#31504C;transform:translateY(-2px)}
.eco-body{padding:16px;flex:1;min-width:0}
/* SIGNATURE: columna de agua */
.column{width:52px;flex:0 0 52px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:linear-gradient(180deg,#16303A,#0E1B1C 55%,#1A140F)}
.zone{flex:1;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.05)}
.zone:last-child{border-bottom:none}
.zone b{font-family:var(--ff-m);font-size:13px;font-weight:500}
.zone span{position:absolute;left:5px;top:5px;font-family:var(--ff-m);font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.32)}
.z-top b{color:#8FD6E8} .z-mid b{color:var(--moss)} .z-bot b{color:var(--wood)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item.tap{cursor:pointer;transition:.12s}
.item.tap:hover{background:#152021}
.item .grow{flex:1;min-width:0}
.item .t{font-size:14.5px}
.item .s{font-size:12.5px;color:var(--dim)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* checkbox */
.chk{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1.5px solid #33484A;display:grid;place-items:center;font-size:12px;color:transparent;transition:.15s}
.chk:hover{border-color:var(--moss)}
.chk.on{background:var(--moss);border-color:var(--moss);color:#06231A}
.chk.half{border-color:var(--warn);color:var(--warn)}
.chk.skip{border-color:var(--faint);color:var(--faint)}
.done .t{text-decoration:line-through;color:var(--faint)}

/* ---------- metrics ---------- */
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px}
.metric .k{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.metric .v{font-family:var(--ff-m);font-size:21px;letter-spacing:-.02em;margin-top:3px}
.metric .v small{font-size:11px;color:var(--dim);letter-spacing:0}
.metric .d{font-size:11px;color:var(--faint);margin-top:2px}
.metric.empty .v{color:var(--faint);font-size:14px}

/* ---------- alerts ---------- */
.alert{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);align-items:flex-start}
.alert.crit{border-color:#4E2620;background:linear-gradient(90deg,#22110E,var(--card) 70%)}
.alert.warn{border-color:#4A3B18;background:linear-gradient(90deg,#1E180B,var(--card) 70%)}
.alert .bar{width:3px;border-radius:2px;align-self:stretch;background:var(--dim)}
.alert.crit .bar{background:var(--alert)} .alert.warn .bar{background:var(--warn)} .alert.info .bar{background:var(--moss)}
.alert .why{font-size:12.5px;color:var(--dim);margin-top:3px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 12px;font-size:13.5px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--txt);border-bottom-color:var(--moss)}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:11px}
label.f .lb{display:block;font-family:var(--ff-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
input,select,textarea{
  width:100%;background:#0C1516;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font-size:14px
}
input:focus,select:focus,textarea:focus{border-color:#33564E;outline:none}
textarea{min-height:78px;resize:vertical;font-family:inherit}
.hint{font-size:11.5px;color:var(--faint);margin-top:4px}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(4,8,9,.72);backdrop-filter:blur(4px);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .18s}
.modal{background:#0F1A1B;border:1px solid var(--line);border-radius:16px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0F1A1B;z-index:2}
.modal .body{padding:16px 18px}
.modal footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#0F1A1B}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- chat ---------- */
.fab{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,var(--moss),#2E7A62 55%,var(--led));display:grid;place-items:center;font-size:21px;box-shadow:0 10px 28px rgba(0,0,0,.5);z-index:40;transition:.18s}
.fab:hover{transform:translateY(-2px) scale(1.03)}
.chatpanel{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:#0B1416;border-left:1px solid var(--line);z-index:70;display:flex;flex-direction:column;animation:slide .22s}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.chatlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--card2);border:1px solid var(--line);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:linear-gradient(180deg,#12211F,#0E1A19);border:1px solid #24413A;border-bottom-left-radius:4px}
.msg .src{display:block;margin-top:7px;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.chatin{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.sugg button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.sugg button:hover{color:var(--txt);border-color:#33504A}

/* ---------- misc ---------- */
.bar-track{height:6px;border-radius:3px;background:#162325;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--moss)}
.risk{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.risk div{display:grid;place-items:center;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.empty{padding:34px 18px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--txt);font-family:var(--ff-d);margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16262A;border:1px solid #2C4A46;padding:10px 16px;border-radius:11px;z-index:90;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:fade .15s}
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 15px}
.tl .ev::before{content:'';position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--card2);border:1.5px solid var(--faint)}
.tl .ev.hi::before{background:var(--moss);border-color:var(--moss)}
.mobnav{display:none}
.only-mob{display:none}

@media(max-width:860px){
  .rail{display:none}
  main{padding:16px 14px 96px;max-width:100%}
  h1{font-size:22px}
  .only-mob{display:block}
  .mobnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(9,15,16,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:7px 6px calc(7px + env(safe-area-inset-bottom))
  }
  .mobnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;color:var(--faint);font-size:10px}
  .mobnav a.on{color:var(--moss)}
  .mobnav .ic{font-size:17px}
  .fab{bottom:78px;right:14px;width:48px;height:48px}
  .chatpanel{width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>
<nav class="mobnav" id="mobnav"></nav>
<button class="fab" id="fab" title="Asistente">💬</button>
<div id="overlay"></div>
<script>
/* ============================================================
   BIOMA · núcleo
   Estado, persistencia, semilla y motores de análisis.
   ============================================================ */
const uid = p => (p||'id') + '_' + Math.random().toString(36).slice(2, 9);
const todayISO = () => new Date().toISOString().slice(0, 10);
const nowISO = () => new Date().toISOString();
const days = (a, b) => Math.round((new Date(b || nowISO()) - new Date(a)) / 864e5);
const fmt = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }); };
const fmtFull = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }); };
const fmtHora = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = iso => { if (!iso) return 'nunca'; const d = days(iso); return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} d`; };

/* ---------- persistencia (artifact storage → localStorage → memoria) ---------- */
const KEY = 'bioma:v1';
let memory = null;
const Store = {
  async get() {
    try { if (window.storage) { const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; } } catch (e) { }
    try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) { }
    return memory;
  },
  async set(v) {
    memory = v;
    const s = JSON.stringify(v);
    try { if (window.storage) { await window.storage.set(KEY, s); return; } } catch (e) { }
    try { localStorage.setItem(KEY, s); } catch (e) { }
  },
  async clear() {
    memory = null;
    try { if (window.storage) await window.storage.delete(KEY); } catch (e) { }
    try { localStorage.removeItem(KEY); } catch (e) { }
  }
};

let S = null;          // estado global
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(() => Store.set(S), 180); }

/* ---------- rangos de referencia por tipo de parámetro ---------- */
const PARAMS = {
  temp: { label: 'Temperatura', unit: '°C', dec: 1 },
  ph: { label: 'pH', unit: '', dec: 2 },
  tds: { label: 'TDS', unit: 'ppm', dec: 0 },
  gh: { label: 'GH', unit: '°d', dec: 0 },
  kh: { label: 'KH', unit: '°d', dec: 0 },
  nh3: { label: 'NH3/NH4', unit: 'mg/L', dec: 2 },
  no2: { label: 'NO2', unit: 'mg/L', dec: 2 },
  no3: { label: 'NO3', unit: 'mg/L', dec: 0 },
  cl2: { label: 'Cloro', unit: 'mg/L', dec: 2 },
  o2: { label: 'Oxígeno', unit: 'mg/L', dec: 1 },
  hum: { label: 'Humedad', unit: '%', dec: 0 },
  tcaliente: { label: 'T. zona caliente', unit: '°C', dec: 1 },
  tfria: { label: 'T. zona fría', unit: '°C', dec: 1 },
  uvi: { label: 'Índice UV', unit: 'UVI', dec: 1 },
  peso: { label: 'Peso animal', unit: 'g', dec: 0 }
};
const RANGES = {
  acuario: { temp: [24, 28], ph: [6.5, 8.2], nh3: [0, 0.02], no2: [0, 0.05], no3: [0, 40], tds: [100, 500] },
  terrario: { tcaliente: [28, 32], tfria: [21, 26], hum: [50, 80], uvi: [2.5, 3.5] }
};

/* ============================================================
   SEMILLA — construida a partir del Documento Maestro
   Regla: nada inventado. status: 'confirmado' | 'probable' | 'pendiente'
   ============================================================ */
function seed() {
  const t = todayISO();
  const d = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);

  const E1 = 'eco_600', E2 = 'eco_18', E3 = 'eco_cam', E4 = 'eco_gamb';

  const ecosystems = [
    {
      id: E1, name: 'Acuario 600 L', type: 'acuario', subtype: 'Dulce · selva inundada',
      liters: 600, dims: '120 × 75 × 75 cm', status: 'ciclando', montaje: d(2),
      concepto: 'Selva inundada / predator · oddball. Pocos protagonistas, mucha madera, Dragon Stone, corredor central abierto.',
      soil: 'Soil negro activo (referencia: Oase Scaper Soil)', hardscape: 'Dragon Stone + raíces grandes; raíz diagonal central',
      ubicacion: 'Casa, Mallorca', color: '#7FD1A6'
    },
    {
      id: E2, name: 'Acuario 18 L', type: 'acuario', subtype: 'Dulce · nano',
      liters: 18, dims: 'pendiente de medir', status: 'activo', montaje: null,
      concepto: 'Nano de casa. Bajo mantenimiento, un protagonista.', soil: 'pendiente', hardscape: 'pendiente',
      ubicacion: 'Casa, Mallorca', color: '#8FD6E8'
    },
    {
      id: E3, name: 'Terrario camaleón pantera', type: 'terrario', subtype: 'Árboreo · tropical',
      liters: null, dims: 'objetivo mínimo 60 × 60 × 120 cm (malla)', status: 'planificado', montaje: null,
      concepto: 'Furcifer pardalis. Terrario de malla, altura sobre superficie, ventilación cruzada, plantas vivas y goteo.',
      soil: 'Sin sustrato suelto en fase inicial (riesgo de impactación); bandeja de drenaje',
      hardscape: 'Ramas horizontales de distintos diámetros + Ficus benjamina / Pothos',
      ubicacion: 'Casa, Mallorca', color: '#A98BF5'
    },
    {
      id: E4, name: 'Gambario', type: 'acuario', subtype: 'Dulce · invertebrados',
      liters: null, dims: 'pendiente', status: 'idea', montaje: null,
      concepto: 'Neocaridina davidi. Sin depredadores, musgo abundante, filtración esponja.',
      soil: 'pendiente', hardscape: 'pendiente', ubicacion: 'Casa, Mallorca', color: '#D08A57'
    }
  ];

  const A = (o) => Object.assign({
    id: uid('an'), ecoId: E1, qty: 1, zona: 'fondo', estado: 'activo', ingreso: d(2),
    sizeCm: null, adultCm: null, dificultad: 'medio', vida: null, dieta: '', comportamiento: '',
    compat: '', incompat: '', clase: 'pez', ident: 'confirmado', nocturno: false, notas: '', foto: ''
  }, o);

  const animals = [
    A({
      id: 'an_bichir', nombre: 'Bichir albino', sci: 'Polypterus senegalus (albino)', ident: 'probable',
      qty: 1, sizeCm: 8, adultCm: 30, zona: 'fondo', nocturno: true, vida: '10–15 años', dificultad: 'medio',

const eco = id => S.ecosystems.find(e => e.id === id);
const animalsOf = id => S.animals.filter(a => a.ecoId === id && a.estado !== 'fallecido' && a.estado !== 'trasladado');
const allAnimalsOf = id => S.animals.filter(a => a.ecoId === id);
const me = () => S.users.find(u => u.id === S.currentUser) || S.users[0];
const isOwner = () => me().rol === 'owner';
const countAnimals = id => animalsOf(id).reduce((n, a) => n + (a.qty || 1), 0);

function lastParam(ecoId, key) {
  const l = S.params.filter(p => p.ecoId === ecoId && p.key === key).sort((a, b) => a.fecha < b.fecha ? 1 : -1);
  return l[0] || null;
}
function series(ecoId, key) {
  return S.params.filter(p => p.ecoId === ecoId && p.key === key).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
}
function audit(accion, detalle) {
  S.audit.unshift({ id: uid('au'), ts: nowISO(), user: me().nombre, accion, detalle });
  S.audit = S.audit.slice(0, 400);
}
function addTimeline(ecoId, tipo, texto, hi) {
  S.timeline.unshift({ id: uid('tl'), ecoId, fecha: todayISO(), tipo, texto, hi: !!hi });
}

/* ============================================================
   MOTOR 1 · Tareas y vencimientos
   ============================================================ */
function taskDue(t) {
  if (!t.activa) return null;
  if (!t.ultimo) return { due: todayISO(), overdue: 0 };
  const next = new Date(new Date(t.ultimo).getTime() + t.freqDias * 864e5).toISOString().slice(0, 10);
  return { due: next, overdue: days(next) };
}
function tasksToday(ecoId) {
  return S.tasks.filter(t => (!ecoId || t.ecoId === ecoId) && t.activa).map(t => {
    const d = taskDue(t);
    return { ...t, due: d.due, overdue: d.overdue, hoy: d.due <= todayISO() };
  }).filter(t => t.hoy).sort((a, b) => (a.hora || '99') < (b.hora || '99') ? -1 : 1);
}
function doneToday(taskId) {
  return S.taskLogs.find(l => l.taskId === taskId && l.fecha === todayISO()) || null;
}

/* ============================================================
   MOTOR 2 · Crecimiento y compatibilidad futura
   ============================================================ */
function growthRate(animalId) {           // cm por mes
  const m = S.measurements.filter(x => x.animalId === animalId).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  if (m.length < 2) return null;
  const f = m[0], l = m[m.length - 1];
  const dd = days(f.fecha, l.fecha);
  if (dd < 7) return null;
  return ((l.cm - f.cm) / dd) * 30;
}
function currentSize(a) {
  const m = S.measurements.filter(x => x.animalId === a.id).sort((a2, b) => a2.fecha < b.fecha ? 1 : -1);
  return m[0] ? m[0].cm : a.sizeCm;
}
// Un depredador puede tragar presas de hasta ~35 % de su longitud.
const PREY_RATIO = 0.35;
function predationScan(ecoId) {
  const list = animalsOf(ecoId);
  const preds = list.filter(a => /depredador|emboscada|caza/i.test(a.comportamiento || '') || ['an_bichir', 'an_cteno'].includes(a.id));
  const out = [];
  preds.forEach(p => {
    const now = currentSize(p) || 0;
    const adult = p.adultCm || 0;
    const rate = growthRate(p.id);
    list.filter(v => v.id !== p.id && v.clase !== 'molusco').forEach(v => {
      const vAdult = v.adultCm || currentSize(v) || 0;
      if (!vAdult || !adult) return;
      const needed = vAdult / PREY_RATIO;          // talla del depredador para tragarlo
      if (needed > adult * 1.05) return;           // nunca llegará a ser una amenaza
      const yaEs = now >= needed;
      let meses = null;
      if (!yaEs && rate && rate > 0) meses = Math.max(0, (needed - now) / rate);
      out.push({ pred: p, prey: v, needed: Math.round(needed * 10) / 10, yaEs, meses, rate });
    });
  });
  return out.sort((a, b) => (a.meses ?? 999) - (b.meses ?? 999));
}

/* ============================================================
   MOTOR 3 · Alertas y estado del ecosistema
   ============================================================ */
function alertsFor(ecoId) {
  const e = eco(ecoId); const out = []; const R = RANGES[e.type] || {};
  const push = (nivel, txt, why, accion) => out.push({ nivel, txt, why, accion });

  Object.keys(R).forEach(k => {
    const p = lastParam(ecoId, k);
    if (!p) return;
    const [lo, hi] = R[k];
    if (p.val > hi) push(k === 'nh3' || k === 'no2' ? 'crit' : 'warn',
      `${PARAMS[k].label} por encima del rango: ${p.val} ${PARAMS[k].unit}`,
      `Rango de referencia ${lo}–${hi}. Medido el ${fmtFull(p.fecha)}.`, null);
    else if (p.val < lo) push('warn', `${PARAMS[k].label} por debajo del rango: ${p.val} ${PARAMS[k].unit}`,
      `Rango de referencia ${lo}–${hi}. Medido el ${fmtFull(p.fecha)}.`, null);
  });

  // parámetros críticos sin medir en fase de ciclado
  if (e.type === 'acuario' && (e.status === 'ciclando' || e.status === 'montaje')) {
    ['nh3', 'no2'].forEach(k => {
      const p = lastParam(ecoId, k);
      if (!p) push('warn', `Sin registro de ${PARAMS[k].label}`, 'El acuario está ciclando: es el dato que decide si se puede seguir avanzando.', 'medir');
      else if (days(p.fecha) >= 3) push('warn', `${PARAMS[k].label} sin medir desde hace ${days(p.fecha)} días`, 'En ciclado conviene medir cada 48 h.', 'medir');
    });
    if (!lastParam(ecoId, 'temp')) push('info', 'Temperatura sin registrar', 'No hay ninguna lectura de temperatura en este ecosistema. Sin ese dato no se puede evaluar el confort de los habitantes.', 'medir');
    if (!lastParam(ecoId, 'no3')) push('info', 'NO3 sin registrar', 'Es la referencia para saber si el ciclo se ha completado.', 'medir');
  }

  // tendencia de nitratos
  const s = series(ecoId, 'no3');
  if (s.length >= 3) {
    const l3 = s.slice(-3);
    if (l3[2].val > l3[1].val && l3[1].val > l3[0].val)
      push('warn', 'NO3 sube en las tres últimas lecturas', `${l3.map(x => x.val).join(' → ')} mg/L. Revisa alimentación y frecuencia de cambios de agua.`, null);
  }

  // tareas vencidas
  S.tasks.filter(t => t.ecoId === ecoId && t.activa).forEach(t => {
    const d = taskDue(t);
    if (d.overdue >= Math.max(2, t.freqDias * 0.5) && !doneToday(t.id))
      push(t.tipo === 'alimentacion' || t.tipo === 'seguridad' ? 'warn' : 'info',
        `"${t.titulo}" lleva ${d.overdue} días de retraso`, `Frecuencia configurada: cada ${t.freqDias} días.`, 'tarea:' + t.id);
  });

  // depredación
  predationScan(ecoId).forEach(r => {
    if (r.yaEs) push('warn', `${r.pred.nombre} ya puede tragar a ${r.prey.nombre}`,
      `${r.pred.nombre} mide ${currentSize(r.pred)} cm y ${r.prey.nombre} llega a ${r.prey.adultCm} cm. Umbral estimado: ${r.needed} cm.`, null);
    else if (r.meses !== null && r.meses < 6) push('info', `${r.prey.nombre}: riesgo de depredación en ~${Math.round(r.meses)} meses`,
      `Al ritmo medido, ${r.pred.nombre} alcanzará los ${r.needed} cm necesarios. No esperes a la primera baja para trasladarlos.`, null);
  });

  // identificaciones pendientes
  const pend = animalsOf(ecoId).filter(a => a.ident === 'pendiente');
  if (pend.length) push('info', `${pend.length} habitante(s) sin identificar`,
    pend.map(a => a.nombre).join(', ') + '. Sin especie no se puede calcular compatibilidad adulta.', null);

  const order = { crit: 0, warn: 1, info: 2 };
  return out.sort((a, b) => order[a.nivel] - order[b.nivel]);
}
function ecoStatus(ecoId) {
  const a = alertsFor(ecoId);
  if (a.some(x => x.nivel === 'crit')) return { k: 'CRÍTICO', cls: 'bad', why: a.find(x => x.nivel === 'crit').txt };
  const w = a.filter(x => x.nivel === 'warn');
  if (w.length >= 2) return { k: 'ATENCIÓN', cls: 'warn', why: `${w.length} avisos abiertos` };
  if (w.length === 1) return { k: 'OBSERVACIÓN', cls: 'warn', why: w[0].txt };
  if (a.length) return { k: 'OBSERVACIÓN', cls: 'ok', why: a[0].txt };
  return { k: 'ESTABLE', cls: 'ok', why: 'Sin avisos abiertos' };
}

/* ============================================================
   MOTOR 4 · Recomendaciones razonadas
   ============================================================ */
function recommendations(ecoId) {
  const e = eco(ecoId); const out = [];
  const nAnimals = countAnimals(ecoId);
  const edad = e.montaje ? days(e.montaje) : null;

  if (e.type === 'acuario' && edad !== null && edad < 45 && nAnimals > 10) {
    out.push({
      t: 'No añadir más animales por ahora',
      por: `El acuario tiene ${edad} días y ya sostiene ${nAnimals} animales introducidos en poco tiempo.`,
      ev: 'Fecha de montaje y censo actual.',
      acc: 'Medir NH3/NH4 y NO2 cada 48 h durante 7 días antes de plantear cualquier incorporación.',
      urg: 'alta'
    });
  }
  const lz = S.lighting.find(l => l.ecoId === ecoId);
  if (lz && edad !== null && edad < 60) {
    out.push({
      t: `Mantener el fotoperiodo en ${lz.horas} h`,
      por: 'Un acuario recién montado con soil activo y poca masa vegetal establecida es terreno fácil para las algas.',
      ev: `Iluminación configurada ${lz.on}–${lz.off}.`,
      acc: 'Subir a 7 h solo cuando las plantas muestren crecimiento nuevo claro y no haya algas filamentosas.',
      urg: 'media'
    });
  }
  const pend = animalsOf(ecoId).filter(a => a.ident === 'pendiente');
  if (pend.length) out.push({
    t: 'Cerrar la identificación pendiente',
    por: 'La compatibilidad futura se calcula con el tamaño adulto, y sin especie no hay tamaño adulto.',
    ev: pend.map(a => a.nombre).join(', '),
    acc: 'Foto lateral con buena luz de cada ejemplar y registrarla en su ficha.',
    urg: 'media'
  });
  const risk = predationScan(ecoId).filter(r => !r.yaEs && r.meses !== null && r.meses < 12);
  if (risk.length) out.push({
    t: 'Planificar la salida de los habitantes pequeños',
    por: 'Varios habitantes entrarán en rango de presa dentro del próximo año al ritmo de crecimiento medido.',
    ev: risk.slice(0, 3).map(r => `${r.prey.nombre} (~${Math.round(r.meses)} meses)`).join(', '),
    acc: 'Decidir destino (otro acuario, club, tienda) antes de que ocurra, no después.',
    urg: 'media'
  });
  if (!S.measurements.some(m => days(m.fecha) < 45)) out.push({
    t: 'Registrar una medición de crecimiento',
    por: 'Sin dos medidas separadas en el tiempo no se puede estimar cuándo llega el riesgo de depredación.',
    ev: 'Última medición registrada hace más de 45 días.',
    acc: 'Foto lateral con regla o referencia conocida y anotar la talla en la ficha de cada protagonista.',
    urg: 'media'
  });
  const tapa = S.equipment.find(q => q.ecoId === ecoId && /tapa/i.test(q.nombre));
  if (tapa && !tapa.instalado) out.push({
    t: 'Instalar la tapa definitiva',
    por: 'El bichir es un escapista notable y el Ctenopoma salta. Es el único fallo de este acuario que mata en una noche.',
    ev: 'Equipamiento "Tapa de seguridad" sin fecha de instalación.',
    acc: 'Cierre completo, paso de mangueras sellado y malla que permita intercambio gaseoso.',
    urg: 'alta'
  });
  if (e.type === 'terrario' && e.status === 'planificado') out.push({
    t: 'Montar y estabilizar el terrario antes de traer el animal',
    por: 'El gradiente térmico, el UVI y los ciclos de humedad se ajustan con datos, y eso lleva semanas.',
    ev: 'Ecosistema en estado planificado, sin habitantes.',
    acc: 'Dos o tres semanas registrando zona caliente, zona fría, caída nocturna y humedad antes de la incorporación.',
    urg: 'alta'
  });
  return out;
}

const $ = s => document.querySelector(s);
let route = { view: 'hoy', id: null, tab: 'resumen' };

function go(hash) { location.hash = hash; }
function parseHash() {
  const h = (location.hash || '#/hoy').slice(2).split('/');
  if (h[0] === 'eco' && h[1]) return { view: 'eco', id: h[1], tab: h[2] || 'resumen' };
  if (h[0] === 'animal' && h[1]) return { view: 'animal', id: h[1], tab: null };
  return { view: h[0] || 'hoy', id: null, tab: null };
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 2600);
}

/* ---------- modal genérico de formulario ---------- */
let modalSubmit = null;
function openForm(title, fields, values, onSubmit, submitLabel) {
  values = values || {};
  modalSubmit = () => {
    const data = {};
    fields.forEach(f => {
      const el = document.getElementById('f_' + f.k);
      if (!el) return;
      let v = el.value;
      if (f.type === 'number') v = v === '' ? null : parseFloat(v);
      if (f.type === 'checkbox') v = el.checked;
      data[f.k] = v;
    });
    const bad = fields.find(f => f.req && (data[f.k] === '' || data[f.k] == null));
    if (bad) { toast('Falta ' + bad.label.toLowerCase()); return; }
    onSubmit(data);
    closeModal();
  };
  const body = fields.map(f => {
    const v = values[f.k] != null ? values[f.k] : (f.def != null ? f.def : '');
    let input;
    if (f.type === 'select') input = `<select id="f_${f.k}">${f.options.map(o => {
      const val = typeof o === 'string' ? o : o.v, lab = typeof o === 'string' ? o : o.l;
      return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
    }).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea id="f_${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    else input = `<input id="f_${f.k}" type="${f.type || 'text'}" step="${f.step || 'any'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
    return `<label class="f"><span class="lb">${esc(f.label)}</span>${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</label>`;
  }).join('');
  $('#overlay').innerHTML = `<div class="backdrop" data-close="1"><div class="modal">
    <header class="between"><h2>${esc(title)}</h2><button class="btn sm ghost" data-close="1">✕</button></header>
    <div class="body">${body}</div>
    <footer><button class="btn ghost" data-close="1">Cancelar</button><button class="btn primary" id="mSubmit">${esc(submitLabel || 'Guardar')}</button></footer>
  </div></div>`;
  $('#mSubmit').onclick = () => modalSubmit();
  $('#overlay').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', e => { if (e.target === b) closeModal(); }));
}
function openInfo(title, html) {
  $('#overlay').innerHTML = `<div class="backdrop" data-close="1"><div class="modal">
    <header class="between"><h2>${esc(title)}</h2><button class="btn sm ghost" data-close="1">✕</button></header>
    <div class="body">${html}</div>
    <footer><button class="btn" data-close="1">Cerrar</button></footer></div></div>`;
  $('#overlay').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', e => { if (e.target === b) closeModal(); }));
}
function closeModal() { $('#overlay').innerHTML = ''; }

/* ---------- gráfico de línea en SVG ---------- */
function chart(data, opts) {
  opts = opts || {};
  if (!data.length) return `<div class="empty" style="padding:22px"><b>Sin datos todavía</b>Registra una medición para ver la evolución.</div>`;
  if (data.length === 1) {
    const p = data[0];
    return `<div class="dim" style="font-size:13px">Una sola lectura: <span class="num">${p.val}</span> el ${fmtFull(p.fecha)}. Con dos o más se dibuja la tendencia.</div>`;
  }
  const W = 560, H = 150, P = 26;
  const vals = data.map(d => d.val);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * .15; min -= pad; max += pad;
  const x = i => P + (i / (data.length - 1)) * (W - P * 2);
  const y = v => H - P - ((v - min) / (max - min)) * (H - P * 2);
  const pts = data.map((d, i) => `${x(i).toFixed(1)},${y(d.val).toFixed(1)}`).join(' ');
  const area = `${P},${H - P} ${pts} ${W - P},${H - P}`;
  const c = opts.color || 'var(--moss)';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="Evolución">
    <defs><linearGradient id="g${opts.id || ''}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".22"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#1E2E30"/>
    <polygon points="${area}" fill="url(#g${opts.id || ''})"/>
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.val)}" r="3" fill="${c}"><title>${d.val} · ${fmtFull(d.fecha)}</title></circle>`).join('')}
    <text x="${P}" y="14" fill="#5E736C" font-size="10" font-family="IBM Plex Mono">${max.toFixed(opts.dec ?? 1)}</text>
    <text x="${P}" y="${H - P + 15}" fill="#5E736C" font-size="10" font-family="IBM Plex Mono">${fmt(data[0].fecha)}</text>
    <text x="${W - P}" y="${H - P + 15}" fill="#5E736C" font-size="10" font-family="IBM Plex Mono" text-anchor="end">${fmt(data[data.length - 1].fecha)}</text>
  </svg>`;
}

/* ---------- acciones de tareas ---------- */
function markTask(id) {
  const t = S.tasks.find(x => x.id === id);
  const prev = doneToday(id);
  if (prev) {                       // deshacer
    S.taskLogs = S.taskLogs.filter(l => l.id !== prev.id);
    audit('Tarea desmarcada', t.titulo);
  } else {
    S.taskLogs.push({ id: uid('log'), taskId: id, ecoId: t.ecoId, fecha: todayISO(), ts: nowISO(), user: me().nombre, estado: 'hecha', nota: '' });
    t.ultimo = todayISO();
    audit('Tarea completada', t.titulo);
    if (t.tipo === 'alimentacion') S.feedLogs.push({ id: uid('fd'), ecoId: t.ecoId, ts: nowISO(), user: me().nombre, detalle: t.titulo });
    if (t.freqDias >= 7) addTimeline(t.ecoId, 'mantenimiento', t.titulo + ' — realizado por ' + me().nombre, false);
  }
  save(); render();
}
function taskOptions(id) {
  const t = S.tasks.find(x => x.id === id);
  openInfo(t.titulo, `
    <div class="dim" style="font-size:13.5px;margin-bottom:12px">${esc(t.nota || 'Sin notas.')}</div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <button class="btn" onclick="logState('${id}','parcial')">Hecha a medias</button>
      <button class="btn" onclick="logState('${id}','omitida')">Omitida hoy</button>
      <button class="btn" onclick="postpone('${id}')">Posponer un día</button>
      ${isOwner() ? `<button class="btn" onclick="editTask('${id}')">Editar</button>
      <button class="btn" onclick="delTask('${id}')">Eliminar</button>` : ''}
    </div>`);
}
function logState(id, estado) {
  const t = S.tasks.find(x => x.id === id);
  S.taskLogs = S.taskLogs.filter(l => !(l.taskId === id && l.fecha === todayISO()));
  S.taskLogs.push({ id: uid('log'), taskId: id, ecoId: t.ecoId, fecha: todayISO(), ts: nowISO(), user: me().nombre, estado, nota: '' });
  if (estado === 'parcial') t.ultimo = todayISO();
  audit('Tarea marcada como ' + estado, t.titulo);
  save(); closeModal(); render();
}
function postpone(id) {
  const t = S.tasks.find(x => x.id === id);
  t.ultimo = new Date(Date.now() - (t.freqDias - 1) * 864e5).toISOString().slice(0, 10);
  audit('Tarea pospuesta', t.titulo); save(); closeModal(); render(); toast('Aplazada a mañana');
}
function delTask(id) {

        ${F('Fecha de incorporación', a.ingreso ? fmtFull(a.ingreso) : '')}${F('Notas', a.notas)}

      </div>
    </div>
  </div>`;
}

function userForm() {

function download(name, text, type) {
  const b = new Blob([text], { type: type || 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
}
function exportAll() { download('bioma-backup-' + todayISO() + '.json', JSON.stringify(S, null, 2), 'application/json'); toast('Copia descargada'); }
function importAll() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.onchange = () => { const f = i.files[0]; const r = new FileReader(); r.onload = () => { try { S = JSON.parse(r.result); save(); render(); toast('Copia restaurada'); } catch (e) { toast('El archivo no es una copia válida'); } }; r.readAsText(f); };
  i.click();
}
function resetAll() { if (confirm('Se sustituyen todos los datos por la semilla del Documento Maestro. ¿Continuar?')) { S = seed(); save(); render(); toast('Datos restablecidos'); } }
function exportEco(id) {
  const e = eco(id);
  let md = `# ${e.name}\n\n${e.dims}${e.liters ? ' · ' + e.liters + ' L' : ''} · ${e.status}\n\n${e.concepto}\n\n## Habitantes\n`;
  allAnimalsOf(id).forEach(a => md += `- ${a.nombre} (${a.sci}) ×${a.qty} · ${a.zona} · ${a.estado} · identificación ${a.ident}${a.adultCm ? ' · adulto ~' + a.adultCm + ' cm' : ''}\n`);
  md += `\n## Plantas\n`; S.plants.filter(p => p.ecoId === id).forEach(p => md += `- ${p.nombre} (${p.sci}) · ${p.estado}\n`);
  md += `\n## Equipamiento\n`; S.equipment.filter(q => q.ecoId === id).forEach(q => md += `- ${q.nombre} ${q.marca} ${q.modelo}\n`);
  md += `\n## Últimos parámetros\n`; Object.keys(PARAMS).forEach(k => { const p = lastParam(id, k); if (p) md += `- ${PARAMS[k].label}: ${p.val} ${PARAMS[k].unit} (${p.fecha})\n`; });
  md += `\n## Avisos abiertos\n`; alertsFor(id).forEach(a => md += `- [${a.nivel}] ${a.txt} — ${a.why}\n`);
  download(e.name.replace(/\s+/g, '_') + '.md', md, 'text/markdown'); toast('Ficha exportada');
}
function exportCare() {
  const c = S.caretaker;
  let md = `# Instrucciones para ${c.persona || 'quien cuide los ecosistemas'}\n\n${c.desde ? 'Del ' + fmtFull(c.desde) + ' al ' + fmtFull(c.hasta) : ''}\n`;
  S.ecosystems.filter(e => e.status === 'activo' || e.status === 'ciclando').forEach(e => {
    md += `\n## ${e.name}\n`;
    S.tasks.filter(t => t.ecoId === e.id && t.activa && t.freqDias <= 3).forEach(t => md += `- [ ] ${t.hora ? t.hora + ' · ' : ''}${t.titulo}${t.nota ? ' — ' + t.nota : ''}\n`);
  });
  md += `\n## No hacer\n` + c.noHacer.map(x => `- ${x}\n`).join('');
  download('instrucciones-cuidador.md', md, 'text/markdown'); toast('Instrucciones exportadas');
}

/* ============================================================
   ASISTENTE
   ============================================================ */
let chatOpen = false;
function contextPack() {
  const r = parseHash();
  const id = r.view === 'eco' ? r.id : (r.view === 'animal' ? (S.animals.find(a => a.id === r.id) || {}).ecoId : null);
  return {
    fecha: todayISO(), usuario: me().nombre + ' (' + me().rol + ')',
    ecosistemaAbierto: id ? eco(id) : null,
    ecosistemas: S.ecosystems.map(e => ({
      nombre: e.name, tipo: e.type, litros: e.liters, medidas: e.dims, estado: e.status,
      diasDesdeMontaje: e.montaje ? days(e.montaje) : null,
      habitantes: animalsOf(e.id).map(a => ({ nombre: a.nombre, sci: a.sci, n: a.qty, tallaActual: currentSize(a), tallaAdulta: a.adultCm, zona: a.zona, ident: a.ident, dieta: a.dieta })),
      ultimosParametros: Object.keys(PARAMS).map(k => { const p = lastParam(e.id, k); return p ? `${PARAMS[k].label}=${p.val}${PARAMS[k].unit} (${p.fecha})` : null; }).filter(Boolean),
      tareasHoy: tasksToday(e.id).map(t => t.titulo + (doneToday(t.id) ? ' [hecha]' : ' [pendiente]')),
      avisos: alertsFor(e.id).map(a => a.nivel + ': ' + a.txt)
    })),
    riesgoDepredacion: S.ecosystems.flatMap(e => predationScan(e.id).slice(0, 4).map(r2 => `${r2.pred.nombre} → ${r2.prey.nombre}: ${r2.yaEs ? 'ya en rango' : r2.meses !== null ? '~' + Math.round(r2.meses) + ' meses' : 'sin ritmo medido'}`)),
    ultimasAlimentaciones: S.feedLogs.slice(-6).map(f => `${f.detalle} · ${f.user} · ${fmtFull(f.ts)} ${fmtHora(f.ts)}`),
    documentos: S.docs.map(d => d.titulo)
  };
}
/* motor local determinista: responde solo con datos existentes */
function localAnswer(q) {
  const t = q.toLowerCase();
  const r = parseHash();
  const id = r.view === 'eco' ? r.id : 'eco_600';
  const e = eco(id);

  if (/hoy|qué tengo que hacer|que tengo que hacer|pendiente/.test(t)) {
    const l = S.ecosystems.map(x => ({ x, t: tasksToday(x.id).filter(z => !doneToday(z.id)) })).filter(z => z.t.length);
    if (!l.length) return { txt: 'No queda nada pendiente hoy en ninguno de tus ecosistemas.', src: 'tareas' };
    return { txt: l.map(z => `${z.x.name}:\n` + z.t.map(y => `· ${y.hora ? y.hora + ' — ' : ''}${y.titulo}`).join('\n')).join('\n\n'), src: 'tareas' };
  }
  if (/cambio de agua|último cambio|ultimo cambio/.test(t)) {
    const task = S.tasks.find(x => /cambio de agua/i.test(x.titulo) && x.ecoId === id);
    if (!task || !task.ultimo) return { txt: 'No hay ningún cambio de agua registrado todavía en ' + e.name + '.', src: 'mantenimiento' };
    return { txt: `El último cambio de agua de ${e.name} fue el ${fmtFull(task.ultimo)} (${ago(task.ultimo)}). La pauta configurada es cada ${task.freqDias} días.`, src: 'mantenimiento' };
  }
  if (/cuánto.*com|cuanto.*com|de comer|alimenta/.test(t)) {
    const a = animalsOf(id).find(x => t.includes(x.nombre.toLowerCase().split(' ')[0]));
    if (a) return { txt: `${a.nombre}: ${a.dieta || 'sin dieta registrada'}\n\nRegla práctica: ración que se consuma en unos 2 minutos, y en los depredadores mejor al bajar la luz.`, src: 'ficha del habitante' };
    return { txt: 'Dime de qué habitante quieres la pauta y te doy exactamente lo que hay registrado en su ficha.', src: null };
  }
  if (/ha crecido|crecimiento|cuánto mide|cuanto mide/.test(t)) {
    const a = S.animals.find(x => t.includes(x.nombre.toLowerCase().split(' ')[0])) || S.animals.find(x => x.id === 'an_bichir');
    const rate = growthRate(a.id), cur = currentSize(a);
    if (!rate) return { txt: `${a.nombre} mide ${cur ?? '—'} cm según la última medida registrada. Solo hay una medición, así que todavía no puedo calcular el ritmo: registra otra dentro de 2–4 semanas.`, src: 'crecimiento' };
    return { txt: `${a.nombre}: ${cur} cm, creciendo a ${rate.toFixed(1)} cm/mes. Talla adulta esperada ${a.adultCm} cm.`, src: 'crecimiento' };
  }
  if (/puedo meter|puedo añadir|puedo anadir|añadir un|congo/.test(t)) {
    const edad = e.montaje ? days(e.montaje) : null;
    const risk = predationScan(id).slice(0, 3);
    return {
      txt: `Con los datos actuales de ${e.name}: ${edad !== null ? `lleva ${edad} días montado` : 'sin fecha de montaje registrada'} y sostiene ${countAnimals(id)} animales introducidos recientemente.\n\nMi respuesta ahora mismo es no, y no por espacio: la carga biológica acaba de subir y no hay serie de NH3/NO2 que demuestre que el filtro la absorbe.\n\nAdemás, para cualquier especie candidata la pregunta no es si cabe hoy, sino si sigue siendo compatible con un bichir de 30 cm y un Ctenopoma de 17 cm. ${risk.length ? 'Hoy ya tengo esto en el radar: ' + risk.map(x => x.prey.nombre).join(', ') + '.' : ''}`,
      src: 'ciclado + motor de compatibilidad'
    };
  }
  if (/tds|por qué sube|porque sube/.test(t)) {
    const s = series(id, 'tds');
    if (s.length < 2) return { txt: `Solo tengo ${s.length} lectura de TDS en ${e.name}, así que no puedo hablar de tendencia. Con dos o tres más te digo si sube y por qué.`, src: 'parámetros' };
    return { txt: `TDS en ${e.name}: ${s.map(x => x.val).join(' → ')} ppm. Sube normalmente por evaporación reponiendo con agua de grifo, por acumulación de sales entre cambios o por abonos. Compáralo con el TDS de tu grifo antes de sacar conclusiones.`, src: 'parámetros' };
  }
  if (/viaje|me voy|cuidador/.test(t)) {
    return { txt: 'Ve a Modo cuidador, activa las fechas y la persona, y la app genera la checklist diaria y la lista de "no hacer". Desde ahí puedes exportarla en Markdown para enviársela.', src: 'modo cuidador' };
  }
  if (/nh3|amonio|nitrito|no2|ciclado/.test(t)) {
    const n = lastParam(id, 'nh3'), n2 = lastParam(id, 'no2'), n3 = lastParam(id, 'no3');
    return {
      txt: `${e.name}:\n· NH3/NH4: ${n ? n.val + ' mg/L (' + ago(n.fecha) + ')' : 'sin registrar'}\n· NO2: ${n2 ? n2.val + ' mg/L (' + ago(n2.fecha) + ')' : 'sin registrar'}\n· NO3: ${n3 ? n3.val + ' mg/L (' + ago(n3.fecha) + ')' : 'sin registrar'}\n\nCeros en NH3 y NO2 no demuestran un ciclo maduro por sí solos: lo que lo demuestra es una serie sostenida de ceros con NO3 subiendo, después de una carga biológica real.`, src: 'parámetros'
    };
  }
  if (/camale|terrario|pardalis/.test(t)) {
    return { txt: 'El terrario de camaleón pantera está como proyecto. Su ficha técnica completa está en Documentación del ecosistema (alojamiento, térmica, UVB, agua, dieta y qué cerrar antes de comprar el animal). Lo importante: malla en vez de cristal, altura mínima 120 cm, UVI 2,5–3 en la rama alta, caída térmica nocturna y ninguna manipulación innecesaria.', src: 'documentación' };
  }
  return null;
}
async function askClaude(q) {
  const ctx = contextPack();
  const sys = `Eres el asistente operativo de "Bioma", una app de gestión de acuarios y terrarios. Respondes en español, breve y concreto, con tono de acuariófilo experto y honesto.
REGLA CRÍTICA: usa exclusivamente los datos del CONTEXTO. Si un dato no existe, dilo tal cual ("todavía no tenemos registrado el NH3 actual") y nunca lo estimes ni lo inventes. Distingue siempre entre confirmado, probable y pendiente de identificar. No des cifras de parámetros que no aparezcan en el contexto.
CONTEXTO:
${JSON.stringify(ctx)}`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6', max_tokens: 1000,
      messages: [{ role: 'user', content: sys + '\n\nPREGUNTA: ' + q }]
    })
  });
  const data = await res.json();
  return data.content.filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
}
function renderChat() {
  const p = $('#chatpanel'); if (!p) return;
  const log = p.querySelector('.chatlog');
  log.innerHTML = S.chat.map(m => `<div class="msg ${m.role}">${esc(m.text)}${m.src ? `<span class="src">fuente · ${esc(m.src)}</span>` : ''}</div>`).join('')
    || `<div class="msg ai">Pregúntame por tus ecosistemas. Solo respondo con lo que hay registrado: si un dato no existe, te lo digo en vez de inventarlo.</div>`;
  log.scrollTop = log.scrollHeight;
}
function toggleChat() {
  chatOpen = !chatOpen;
  if (!chatOpen) { const p = $('#chatpanel'); if (p) p.remove(); return; }
  const d = document.createElement('div');
  d.id = 'chatpanel'; d.className = 'chatpanel';
  d.innerHTML = `
    <div class="between" style="padding:14px 16px;border-bottom:1px solid var(--line)">
      <div><h2>Asistente</h2><div class="eyebrow" id="chatctx"></div></div>
      <button class="btn sm ghost" onclick="toggleChat()">✕</button>
    </div>
    <div class="chatlog"></div>
    <div class="sugg">
      ${['¿Qué tengo que hacer hoy?', '¿Puedo meter un tetra Congo?', '¿Ha crecido el bichir?', '¿Cuándo fue el último cambio de agua?', '¿Cómo va el ciclado?'].map(s => `<button onclick="sendChat('${s.replace(/'/g, "\\'")}')">${s}</button>`).join('')}
    </div>
    <div class="chatin">
      <input id="chatq" placeholder="Escribe tu pregunta" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn primary" onclick="sendChat()">Enviar</button>
    </div>`;
  document.body.appendChild(d);
  const r = parseHash();
  $('#chatctx').textContent = r.view === 'eco' ? 'Contexto: ' + eco(r.id).name : 'Contexto: todos los ecosistemas';
  renderChat();
  setTimeout(() => { const i = $('#chatq'); if (i) i.focus(); }, 60);
}
async function sendChat(preset) {
  const input = $('#chatq');
  const q = preset || (input ? input.value.trim() : '');
  if (!q) return;
  if (input) input.value = '';
  S.chat.push({ role: 'me', text: q });
  const local = localAnswer(q);
  if (local) { S.chat.push({ role: 'ai', text: local.txt, src: local.src ? 'datos de la app · ' + local.src : null }); save(); renderChat(); return; }
  S.chat.push({ role: 'ai', text: '…' }); renderChat();
  try {
    const a = await askClaude(q);
    S.chat[S.chat.length - 1] = { role: 'ai', text: a, src: 'modelo + datos de la app' };
  } catch (e) {
    S.chat[S.chat.length - 1] = {
      role: 'ai',
      text: 'No he podido conectar con el modelo, así que respondo solo con lo que tengo registrado. Prueba a preguntarme por tareas de hoy, parámetros, crecimiento, alimentación o el último cambio de agua.',
      src: 'modo sin conexión'
    };
  }
  save(); renderChat();
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  route = parseHash();
  renderNav();
  const v = route.view;
  let html;
  if (v === 'eco') html = viewEco(route.id, route.tab);
  else if (v === 'animal') html = viewAnimal(route.id);
  else if (v === 'ecosistemas') html = viewEcosistemas();
  else if (v === 'crecimiento') html = viewCrecimiento();
  else if (v === 'viaje') html = viewViaje();
  else if (v === 'ajustes') html = viewAjustes();
  else html = viewHoy();
  $('#main').innerHTML = html;
  window.scrollTo(0, 0);
  const c = $('#chatctx');
  if (c) c.textContent = route.view === 'eco' ? 'Contexto: ' + eco(route.id).name : 'Contexto: todos los ecosistemas';
}
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); if (chatOpen) toggleChat(); } });

(async function init() {
  S = await Store.get();
  if (!S || !S.ecosystems) { S = seed(); await Store.set(S); }
  $('#fab').onclick = toggleChat;
  if (!location.hash) location.hash = '#/hoy';
  render();
})();
